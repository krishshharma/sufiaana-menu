<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sufiaana Kitchen Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c2219;
    --bg-2: #123026;
    --gold: #d4a955;
    --gold-soft: rgba(212,169,85,.35);
    --text: #f3e9d6;
    --muted: #b9ab8f;
    --chip-active-text: #0c2219;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0a1d15; --bg-2:#10291f; }
  }
  :root[data-theme="dark"] { --bg:#0a1d15; --bg-2:#10291f; }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 64px; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  header {
    text-align: center; padding: 22px 16px 10px;
  }
  header h1 {
    font-family: "Cormorant Garamond", serif; font-weight: 600;
    font-size: 30px; letter-spacing: .02em; margin: 0; color: var(--gold);
  }
  header p { margin: 4px 0 0; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  nav {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--gold-soft);
  }
  .chips {
    position: relative; display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px;
    scrollbar-width: none; max-width: 760px; margin: 0 auto;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips a {
    flex: none; text-decoration: none; color: var(--text);
    font-size: 13px; font-weight: 500; padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--gold-soft); white-space: nowrap;
  }
  .chips a.on { background: var(--gold); color: var(--chip-active-text); border-color: var(--gold); }
  main { max-width: 760px; margin: 0 auto; padding: 12px 12px 32px; }
  section { margin: 0 0 14px; }
  section img {
    display: block; width: 100%; height: auto; border-radius: 10px;
    background: var(--bg-2); aspect-ratio: 2 / 3;
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 16px 36px; }
  footer .legend { display: inline-flex; gap: 16px; align-items: center; margin-bottom: 8px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .top { color: var(--gold); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>Sufiaana Kitchen</h1>
  <p>Indian · Pakistani · Arabic · Chinese</p>
</header>
<nav><div class="chips" id="chips"></div></nav>
<main id="menu"></main>
<footer>
  <div class="legend"><span><span class="dot" style="background:#2f7d4a"></span>Veg</span><span><span class="dot" style="background:#a3242a"></span>Non Veg</span></div>
  <div>Prices in AED · <a class="top" href="#p1">Back to top</a></div>
</footer>
<script>
  const pages = [
    ["Menu", "Cover"], ["Breakfast"], ["Omelettes"], ["Salads & Sandwich"],
    ["Grill Spot"], ["Biryani & Rice"], ["Vegetarian Paradise"], ["Vegetarian Mains"],
    ["Indian & Pakistani Mains"], ["Bread Basket"], ["Rolls & Wrap"], ["Potato Shatato"],
    ["Beverages"], ["Juices & Lassi"], ["Desserts & Sides"], ["Thank You"]
  ];
  const chips = document.getElementById("chips"), menu = document.getElementById("menu");
  pages.forEach(([name], i) => {
    const n = i + 1, nn = String(n).padStart(2, "0");
    const s = document.createElement("section"); s.id = "p" + n;
    const img = document.createElement("img");
    img.src = "img/page-" + nn + ".webp"; img.width = 1200; img.height = 1800;
    img.alt = "Sufiaana Kitchen menu – " + name; img.loading = n <= 2 ? "eager" : "lazy"; img.decoding = "async";
    s.appendChild(img); menu.appendChild(s);
    if (n > 1 && n < 16) {
      const a = document.createElement("a"); a.href = "#p" + n; a.textContent = name; a.dataset.n = n;
      chips.appendChild(a);
    }
  });
  const links = [...chips.querySelectorAll("a")];
  let current = null;
  function setActive(n) {
    if (n === current) return;
    current = n;
    links.forEach(l => {
      const on = l.dataset.n === n; l.classList.toggle("on", on);
      // Scroll only the chip bar sideways; never touch the page's own scroll.
      if (on) chips.scrollTo({ left: l.offsetLeft - (chips.clientWidth - l.offsetWidth) / 2 });
    });
  }
  const io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) setActive(e.target.id.slice(1)); });
  }, { rootMargin: "-45% 0px -50% 0px" });
  menu.querySelectorAll("section").forEach(s => io.observe(s));
</script>
</body>
</html>
